<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Basic Dashboard Test</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Test Data</h5>
                    </div>
                    <div class="card-body">
                        <p>If you can see this, the template is working!</p>
                        <p th:text="${message}">Basic dashboard message</p>
                        <p>This page doesn't load any data - it's just a test to see if the template system is working.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
