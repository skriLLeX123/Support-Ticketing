<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Environments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Debug Environment Status</h1>
        
        <div th:if="${error}" class="alert alert-danger">
            <strong>Error:</strong> <span th:text="${error}"></span>
        </div>
        
        <div th:if="${message}" class="alert alert-success">
            <span th:text="${message}"></span>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Database Counts</h5>
                    </div>
                    <div class="card-body">
                        <p><strong>Environments:</strong> <span th:text="${environmentCount}">0</span></p>
                        <p><strong>Solutions:</strong> <span th:text="${solutionCount}">0</span></p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="mt-3">
            <a href="/dashboard" class="btn btn-primary">Back to Dashboard</a>
            <a href="/debug/force-associations" class="btn btn-warning ms-2">Force Environment Associations</a>
        </div>
    </div>
</body>
</html>
