<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Dashboard Test</h1>
        <p>If you can see this, the dashboard is working!</p>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Test Tickets</h5>
                    </div>
                    <div class="card-body">
                        <p>Number of tickets: <span th:text="${tickets.size()}">0</span></p>
                        <div th:if="${tickets.size() > 0}">
                            <p>First ticket title: <span th:text="${tickets[0].title}">No title</span></p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Test Solutions</h5>
                    </div>
                    <div class="card-body">
                        <p>Number of solutions: <span th:text="${solutions.size()}">0</span></p>
                        <div th:if="${solutions.size() > 0}">
                            <p>First solution name: <span th:text="${solutions[0].name}">No name</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
