<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Ticket Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-headset me-1"></i>Support Ticket System
            </a>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <h1>Dashboard</h1>
        
        <!-- Dashboard Widgets -->
        <div class="row">
            <!-- Tickets Widget -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="fas fa-ticket-alt me-2"></i>
                            Recent Tickets
                        </h5>
                        <a href="/tickets" class="btn btn-sm btn-outline-primary">View All</a>
                    </div>
                    <div class="card-body">
                        <div class="list-group list-group-flush">
                            <div th:each="ticket, ticketStat : ${tickets}" th:if="${ticketStat.index < 5}" class="list-group-item">
                                <div class="d-flex align-items-center">
                                    <div class="me-3">
                                        <i class="fas fa-ticket-alt text-primary"></i>
                                    </div>
                                    <div class="flex-grow-1">
                                        <div class="fw-bold" th:text="${ticket.title}">Ticket Title</div>
                                        <div class="text-muted small">
                                            <span th:text="${ticket.partnerName}">Partner</span> • 
                                            <span th:text="${ticket.severity}">Severity</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Solutions Widget -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="fas fa-lightbulb me-2"></i>
                            Recent Solutions
                        </h5>
                        <a href="/solutions" class="btn btn-sm btn-outline-primary">View All</a>
                    </div>
                    <div class="card-body">
                        <div class="list-group list-group-flush">
                            <div th:each="solution, solutionStat : ${solutions}" th:if="${solutionStat.index < 5}" class="list-group-item">
                                <div class="d-flex align-items-center">
                                    <div class="me-3">
                                        <i class="fas fa-lightbulb text-warning"></i>
                                    </div>
                                    <div class="flex-grow-1">
                                        <div class="fw-bold" th:text="${solution.name}">Solution Title</div>
                                        <div class="text-muted small" th:text="${solution.description}">Description</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
